name: Stage52 Vendor Setup V2

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build pinned drand vendor
        shell: bash
        env:
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
        run: bash tools/stage52_build_drand_vendor.sh
      - name: Upload vendor artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage52-drand-vendor
          path: stage/vendor/drand
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout trust repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download vendor artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: stage52-drand-vendor
          path: artifact/vendor/drand
      - name: Verify vendor artifact
        shell: bash
        run: bash tools/stage52_verify_vendor_artifact.sh
      - name: Commit vendor bytes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/drand
          mkdir -p vendor
          cp -a artifact/vendor/drand vendor/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/drand
          git diff --cached --quiet && exit 0
          git commit -m "Stage52: vendor pinned drand verifier"
          git push
