name: V6 External Trust Dispatch V3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      drand_round: ${{ steps.challenge.outputs.round }}
      drand_randomness: ${{ steps.challenge.outputs.randomness }}
      drand_signature: ${{ steps.challenge.outputs.signature }}
    steps:
      - name: Fetch and validate fresh public drand challenge
        id: challenge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, urllib.request, os
          chain='8990e7a9aaed2ffed73dbd7092123d6f289930540d7651336225dc172e51b2ce'
          url=f'https://api.drand.sh/{chain}/public/latest'
          req=urllib.request.Request(url,headers={'User-Agent':'V6-Stage54-Trust-Smoke/1'})
          with urllib.request.urlopen(req,timeout=10) as r:
              if r.status != 200:
                  raise SystemExit('DRAND_HTTP_STATUS')
              obj=json.load(r)
          round_=obj.get('round')
          randomness=str(obj.get('randomness','')).lower()
          signature=str(obj.get('signature','')).lower()
          if type(round_) is not int or round_ <= 0:
              raise SystemExit('DRAND_ROUND_INVALID')
          if re.fullmatch(r'[0-9a-f]{64}',randomness) is None:
              raise SystemExit('DRAND_RANDOMNESS_INVALID')
          if re.fullmatch(r'[0-9a-f]{192}',signature) is None:
              raise SystemExit('DRAND_SIGNATURE_INVALID')
          out=os.environ['GITHUB_OUTPUT']
          with open(out,'a',encoding='utf-8') as f:
              f.write(f'round={round_}\nrandomness={randomness}\nsignature={signature}\n')
          PY

  external-trust:
    needs: prepare
    permissions:
      contents: read
      id-token: write
    uses: 1985550705a-sketch/v6-external-trust-verifier/.github/workflows/v6-external-trust-reusable-v3.yml@0d46838c481621cbaf291e27aca7120e7c4e9007
    with:
      raw_evidence_sha256: e88e3bfaea528f38a499941f397025b5fc0a5633d7d48417c02b21f0de6d927c
      drand_round: ${{ fromJSON(needs.prepare.outputs.drand_round) }}
      drand_randomness: ${{ needs.prepare.outputs.drand_randomness }}
      drand_signature: ${{ needs.prepare.outputs.drand_signature }}
      observer_build_sha256: 47b7dd3a0bf2fbe5572ac772f8dafe64abdcad026cc1fdbd3290b9fd87490d79
      subject_boot_identity_sha256: a302899d747dd691af420458f41c8502391727e325de0823c6d5bd037695f367
      subject_process_creation_id: stage54-synthetic-trust-smoke-v1
      prior_accepted_drand_round: 0
