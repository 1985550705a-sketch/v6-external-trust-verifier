name: V6 External Trust Reusable V3

on:
  workflow_call:
    inputs:
      raw_evidence_sha256: {required: true, type: string}
      drand_round: {required: true, type: number}
      drand_randomness: {required: true, type: string}
      drand_signature: {required: true, type: string}
      observer_build_sha256: {required: true, type: string}
      subject_boot_identity_sha256: {required: true, type: string}
      subject_process_creation_id: {required: true, type: string}
      prior_accepted_drand_round: {required: true, type: number}

permissions:
  contents: read
  id-token: write

jobs:
  attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout reusable workflow source at exact job SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Install pinned cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
        with:
          cosign-release: v3.1.4

      - name: Assert cosign version
        shell: bash
        run: |
          set -euo pipefail
          test "$(cosign version --json | jq -r '.gitVersion')" = "v3.1.4"

      - name: Preflight exact identity and privacy-safe inputs
        shell: bash
        env:
          V6_REPOSITORY: ${{ github.repository }}
          V6_REPOSITORY_ID: ${{ github.repository_id }}
          V6_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          V6_REPOSITORY_VISIBILITY: ${{ github.repository_visibility }}
          V6_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          V6_EVENT_NAME: ${{ github.event_name }}
          V6_REF: ${{ github.ref }}
          V6_SHA: ${{ github.sha }}
          V6_WORKFLOW_REF: ${{ github.workflow_ref }}
          V6_WORKFLOW_SHA: ${{ github.workflow_sha }}
          V6_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          V6_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          V6_RUN_ID: ${{ github.run_id }}
          V6_RUN_NUMBER: ${{ github.run_number }}
          V6_RUN_ATTEMPT: ${{ github.run_attempt }}
          V6_INPUT_RAW_EVIDENCE_SHA256: ${{ inputs.raw_evidence_sha256 }}
          V6_INPUT_DRAND_ROUND: ${{ inputs.drand_round }}
          V6_INPUT_DRAND_RANDOMNESS: ${{ inputs.drand_randomness }}
          V6_INPUT_OBSERVER_BUILD_SHA256: ${{ inputs.observer_build_sha256 }}
          V6_INPUT_SUBJECT_BOOT_IDENTITY_SHA256: ${{ inputs.subject_boot_identity_sha256 }}
          V6_INPUT_SUBJECT_PROCESS_CREATION_ID: ${{ inputs.subject_process_creation_id }}
          V6_INPUT_PRIOR_ACCEPTED_DRAND_ROUND: ${{ inputs.prior_accepted_drand_round }}
        run: |
          set -euo pipefail
          python3 tools/stage53_runtime_v3.py preflight \
            --raw-evidence-sha256 "$V6_INPUT_RAW_EVIDENCE_SHA256" \
            --drand-round "$V6_INPUT_DRAND_ROUND" \
            --drand-randomness "$V6_INPUT_DRAND_RANDOMNESS" \
            --observer-build-sha256 "$V6_INPUT_OBSERVER_BUILD_SHA256" \
            --subject-boot-identity-sha256 "$V6_INPUT_SUBJECT_BOOT_IDENTITY_SHA256" \
            --subject-process-creation-id "$V6_INPUT_SUBJECT_PROCESS_CREATION_ID" \
            --prior-accepted-drand-round "$V6_INPUT_PRIOR_ACCEPTED_DRAND_ROUND" \
            --out-dir stage53-out

      - name: Verify fresh drand challenge
        shell: bash
        env:
          V6_INPUT_DRAND_ROUND: ${{ inputs.drand_round }}
          V6_INPUT_DRAND_RANDOMNESS: ${{ inputs.drand_randomness }}
          V6_INPUT_DRAND_SIGNATURE: ${{ inputs.drand_signature }}
        run: |
          set -euo pipefail
          node vendor/drand/verify-beacon.mjs \
            --round "$V6_INPUT_DRAND_ROUND" \
            --randomness "$V6_INPUT_DRAND_RANDOMNESS" \
            --signature "$V6_INPUT_DRAND_SIGNATURE" \
            --max-age-seconds 120 > stage53-out/drand-verify.json

      - name: Keyless sign privacy-safe envelope
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle stage53-out/envelope.sigstore.json \
            stage53-out/envelope.json

      - name: Finalize policy with checked drand and cosign executions
        shell: bash
        env:
          V6_REPOSITORY: ${{ github.repository }}
          V6_REPOSITORY_ID: ${{ github.repository_id }}
          V6_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          V6_REPOSITORY_VISIBILITY: ${{ github.repository_visibility }}
          V6_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          V6_EVENT_NAME: ${{ github.event_name }}
          V6_REF: ${{ github.ref }}
          V6_SHA: ${{ github.sha }}
          V6_WORKFLOW_REF: ${{ github.workflow_ref }}
          V6_WORKFLOW_SHA: ${{ github.workflow_sha }}
          V6_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          V6_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          V6_RUN_ID: ${{ github.run_id }}
          V6_RUN_NUMBER: ${{ github.run_number }}
          V6_RUN_ATTEMPT: ${{ github.run_attempt }}
          V6_INPUT_DRAND_SIGNATURE: ${{ inputs.drand_signature }}
          V6_INPUT_PRIOR_ACCEPTED_DRAND_ROUND: ${{ inputs.prior_accepted_drand_round }}
        run: |
          set -euo pipefail
          python3 tools/stage53_runtime_v3.py finalize \
            --out-dir stage53-out \
            --drand-signature "$V6_INPUT_DRAND_SIGNATURE" \
            --cosign-verify-output stage53-out/cosign-verify.txt \
            --bundle stage53-out/envelope.sigstore.json \
            --prior-accepted-drand-round "$V6_INPUT_PRIOR_ACCEPTED_DRAND_ROUND"

      - name: Re-run adversarial policy unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_v6_external_trust_policy_v3_OFFHOST_ONLY.py'
          python3 -m unittest discover -s tests -p 'test_stage96_finalize_candidate.py'

      - name: Upload privacy-safe trust evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v6-stage53-external-trust-v3-${{ github.run_id }}-${{ github.run_attempt }}
          path: stage53-out
          if-no-files-found: error
          retention-days: 7
