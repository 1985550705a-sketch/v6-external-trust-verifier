name: V6 N64 single public synthetic link smoke CANDIDATE
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      challenge: ${{ steps.challenge.outputs.json }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch bounded public beacon and build public fixture
        id: challenge
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 - <<'PY'
          """Future dispatcher body candidate, not installed. Preserve ONLY the public beacon.
          Reuses the already deployed Stage58 projection and does not read Windows/V6 raw evidence.
          Network call occurs only if this body is explicitly installed and run in a future approved workflow.
          """
          import hashlib, os, urllib.request
          from pathlib import Path
          import stage58_dispatch_prepare as old
          import stage58_external as x
          from stage56_ingress import strict_object
          
          URL='https://api.drand.sh/'+x.CHAIN+'/public/latest'
          FIELDS={'round','randomness','signature','previous_signature'}
          
          def capture(raw):
              x.need(type(raw) is bytes and 0<len(raw)<=2048,'PUBLIC_BEACON_SIZE')
              b=strict_object(raw)
              x.need(set(b)==FIELDS,'PUBLIC_CHAINED_FIELDS')
              outputs=old.project(raw)
              x.need(hashlib.sha256(bytes.fromhex(b['signature'])).hexdigest()==b['randomness'],'PUBLIC_RANDOMNESS_BINDING')
              return x.canon(b),x.canon(outputs)
          
          def main():
              req=urllib.request.Request(URL,headers={'User-Agent':'V6-N64-PUBLIC-SYNTHETIC/1'})
              with urllib.request.urlopen(req,timeout=10) as r:
                  x.need(r.status==200 and r.geturl()==URL,'PUBLIC_BEACON_HTTP')
                  beacon,outputs=capture(r.read(2049))
              # The output file is exact allowlisted public fields, never arbitrary API response bytes.
              with Path('public-beacon.json').open('xb') as f:f.write(beacon)
              with open(os.environ['GITHUB_OUTPUT'],'a',encoding='ascii') as f:f.write('json='+outputs.decode('ascii')+'\n')
          if __name__=='__main__':main()
          PY
      - name: Preserve public drand beacon only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v6-n64-public-beacon-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-beacon.json
          if-no-files-found: error
          retention-days: 7
  link:
    needs: prepare
    permissions:
      contents: read
      id-token: write
    uses: 1985550705a-sketch/v6-external-trust-verifier/.github/workflows/v6-n64-link-reusable-v1.yml@bb20fbad20449124a575a7901ad62426c8c3c32c
    with:
      challenge_sha256: ${{ fromJSON(needs.prepare.outputs.challenge).challenge_sha256 }}
      drand_randomness: ${{ fromJSON(needs.prepare.outputs.challenge).drand_randomness }}
      drand_round: ${{ fromJSON(needs.prepare.outputs.challenge).drand_round }}
      drand_signature: ${{ fromJSON(needs.prepare.outputs.challenge).drand_signature }}
      generation_sha256: ${{ fromJSON(needs.prepare.outputs.challenge).generation_sha256 }}
      observation_commitment_sha256: ${{ fromJSON(needs.prepare.outputs.challenge).observation_commitment_sha256 }}
      observer_build_sha256: ${{ fromJSON(needs.prepare.outputs.challenge).observer_build_sha256 }}
      observer_signature_sha256: ${{ fromJSON(needs.prepare.outputs.challenge).observer_signature_sha256 }}
      prior_accepted_drand_round: ${{ fromJSON(needs.prepare.outputs.challenge).prior_accepted_drand_round }}
      raw_evidence_sha256: ${{ fromJSON(needs.prepare.outputs.challenge).raw_evidence_sha256 }}
      subject_boot_identity_sha256: ${{ fromJSON(needs.prepare.outputs.challenge).subject_boot_identity_sha256 }}
      subject_process_creation_id: ${{ fromJSON(needs.prepare.outputs.challenge).subject_process_creation_id }}
