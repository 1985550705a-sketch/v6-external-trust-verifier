name: V6 N64 observer release provenance v1
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
        with:
          cosign-release: v3.1.4
      - name: Create exact observer release statement
        shell: bash
        env:
          V6_REPOSITORY: ${{ github.repository }}
          V6_RUN_ID: ${{ github.run_id }}
          V6_RUN_ATTEMPT: ${{ github.run_attempt }}
          V6_HEAD_SHA: ${{ github.sha }}
          V6_WORKFLOW_REF: ${{ github.workflow_ref }}
          V6_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$V6_REPOSITORY" = "1985550705a-sketch/v6-external-trust-verifier"
          test "$V6_RUN_ATTEMPT" = "1"
          python3 - <<'PY'
          import base64,hashlib,json,os
          raw=base64.b64decode("",validate=True)
          if hashlib.sha256(raw).hexdigest()!="09c5a1942ac8febe593f06f735570e1590b1042b976ed96c855a0faa98a6c55d":
              raise SystemExit("RELEASE_SHA_MISMATCH")
          x=json.loads(raw.decode("utf-8"))
          canon=json.dumps(x,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False).encode()
          if canon!=raw:
              raise SystemExit("RELEASE_NOT_CANONICAL")
          open("observer-release.json","wb").write(raw)
          meta={
            "schema":"V6_N64_OBSERVER_RELEASE_RUN_IDENTITY_V1",
            "repository":os.environ["V6_REPOSITORY"],
            "run_id":os.environ["V6_RUN_ID"],
            "run_attempt":os.environ["V6_RUN_ATTEMPT"],
            "head_sha":os.environ["V6_HEAD_SHA"],
            "workflow_ref":os.environ["V6_WORKFLOW_REF"],
            "workflow_sha":os.environ["V6_WORKFLOW_SHA"],
            "release_sha256":"09c5a1942ac8febe593f06f735570e1590b1042b976ed96c855a0faa98a6c55d"
          }
          open("run-identity.json","wb").write(json.dumps(meta,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False).encode())
          PY
          test "$(sha256sum observer-release.json | awk '{print $1}')" = "09c5a1942ac8febe593f06f735570e1590b1042b976ed96c855a0faa98a6c55d"
          cosign sign-blob --yes --bundle observer-release.sigstore.json observer-release.json
          cosign verify-blob observer-release.json             --bundle observer-release.sigstore.json             --certificate-identity "https://github.com/1985550705a-sketch/v6-external-trust-verifier/.github/workflows/v6-n64-observer-release-v1.yml@refs/heads/main"             --certificate-oidc-issuer "https://token.actions.githubusercontent.com"             --certificate-github-workflow-repository "1985550705a-sketch/v6-external-trust-verifier"             --certificate-github-workflow-ref "refs/heads/main"             --certificate-github-workflow-sha "$V6_HEAD_SHA"             --certificate-github-workflow-trigger "workflow_dispatch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v6-n64-observer-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            observer-release.json
            observer-release.sigstore.json
            run-identity.json
          if-no-files-found: error
          retention-days: 7
